<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smeltworks Idle</title>
<link rel="stylesheet" href="css/game.css?v=0.115.0">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">Smeltworks <i>Idle</i></div>
    <div class="purse">
      <div class="cur best" data-tip-text="Deepest level reached"><span>Deepest</span><b id="cur-best">1</b></div>
    </div>
    <div class="ctl">
      <button id="btn-sound" class="icon" title="Sound">♪</button>
      <button id="btn-menu" class="icon" title="Settings">⚙</button>
    </div>
  </header>

  <main id="main">
    <section id="left" class="pane">
      <div id="shop"></div>
      <div id="tab-skills" class="tab"></div>
    </section>

    <section id="mid">
      <div id="fight" class="pane">
        <div class="fhead">
          <div class="fside">
            <button id="lv-prev" class="icon" title="Previous level">◀</button>
            <div class="lv"><b id="lv-n"></b><span id="lv-act"></span></div>
            <button id="lv-next" class="icon" title="Next level (Shift: the deepest open)">▶</button>
          </div>
          <div id="pips"></div>
          <div class="fside right">
          <div class="cur core" data-tip-text="Cores banked"><i></i><b id="cur-cores">0</b></div>
          <button id="btn-prestige" data-act="prestige-now"></button>
          </div>
        </div>
        <div class="lifebar" data-tip-text="Life. Full at the start of a level; it must last all ten fights.">
          <div id="life-fill"></div><span id="life-txt"></span>
        </div>
        <div id="arena">
          <canvas id="cv"></canvas>
          <div class="ehead"><b id="e-name"></b><div id="e-status"></div></div>
          <div class="hpbar"><div id="hp-fill"></div><span id="hp-txt"></span></div>
          <div id="banner"></div>
          <div id="interlude" class="hidden"></div>
          <div id="count" class="hidden"></div>
          <div id="dead" class="hidden"><div class="dbox"><b id="dead-title"></b><small id="dead-sub"></small><span id="dead-n"></span></div></div>
          <div id="toasts"></div>
        </div>
      </div>
    </section>

    <aside id="side" class="pane">
      <div id="goldbar" class="cur gold" data-tip-text="Gold"><i></i><b id="cur-gold">0</b><span>gold</span></div>
      <div id="cursor"></div>
      <div id="line"></div>
    </aside>
  </main>
</div>
<div id="prestige" class="hidden"><div class="box" id="pres-box"></div></div>
<div id="tip" class="hidden"></div>
<div id="modal" class="hidden"></div>

<script src="js/data.js?v=0.115.0"></script>
<script src="js/notes.js?v=0.115.0"></script>
<script src="js/game.js?v=0.115.0"></script>
<script src="js/telemetry.js?v=0.115.0"></script>
<script src="js/sprites.js?v=0.115.0"></script>
<script src="js/sprites2.js?v=0.115.0"></script>
<script src="js/audio.js?v=0.115.0"></script>
<script src="js/arena.js?v=0.115.0"></script>
<script src="js/ui.js?v=0.115.0"></script>
<script src="js/main.js?v=0.115.0"></script>
</body>
</html>
